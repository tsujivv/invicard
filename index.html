<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ef" />
  <title>FENNEL Invitation Card Demo</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main class="experience" aria-label="3D invitation card demo">
    <canvas id="scene" aria-label="Tap the invitation card to flip it"></canvas>

    <header class="chrome chrome-top">
      <span>INVITATION</span>
      <strong>FENNEL VIP NIGHT 2026</strong>
    </header>

    <footer class="chrome chrome-bottom">
      <button id="flipButton" type="button">TAP CARD TO FLIP</button>
      <button id="shareButton" type="button">SHARE DEMO</button>
    </footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
